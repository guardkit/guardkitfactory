[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardkitfactory"
version = "0.2.0"
description = "LangGraph-based harness for the GuardKit AutoBuild adversarial-cooperation orchestrator"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Richard Woollcott", email = "rich@appmilla.com" },
]
# deepagents-code 0.1.69 supports Python 3.12 through 3.x. Keep the runtime
# contract explicit because dcode is the required local Player.
requires-python = ">=3.12,<4"

# Deep Agents is pinned exactly because its built-in prompt, middleware and
# backend tool surface are application behavior. Version 0.7.14 requires
# langchain>=1.4, langchain-core>=1.6.3 and langsmith>=0.12.4; the remaining
# upper bounds keep the compatible major families explicit. The permission
# limitation for execute-capable backends remains documented in
# src/guardkitfactory/harness/permissions.py.
dependencies = [
    "deepagents==0.7.14",
    # Required local Player runtime. Keep this exact alongside the SDK pin:
    # dcode is the single normal Player path and there is no native fallback.
    "deepagents-code==0.1.69",
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    "langchain-core>=1.6.3,<2",
    "langsmith>=0.12.4,<1",
    # The LangGraph harness builds a chat-completions ``ChatOpenAI`` for the
    # llama-swap / OpenAI-compatible substrate (langgraph_harness.py
    # ``_build_synthesis_model`` + the selector's resolved ``openai:<alias>``
    # models). Imported lazily, but REQUIRED at runtime for any OpenAI-endpoint
    # run (e.g. the GB10 llama-swap Coach/Player) — previously undeclared, so a
    # clean ``uv sync`` pruned it and the synthesis call failed at runtime.
    # (TASK-OPS-COACHMOE01, 2026-06-11.)
    "langchain-openai>=1.6,<2",
    # code_search's ``references`` operation reads the project's declared
    # language servers from ``.guardkit/config.yaml`` (28 October 2026). It
    # was already installed through langchain-core; now it is declared.
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/appmilla/guardkitfactory"
"Parent review" = "https://github.com/appmilla/guardkit"

# ---------------------------------------------------------------------------
# setuptools layout
# ---------------------------------------------------------------------------
# The package lives under src/guardkitfactory/ (src layout). The vendored
# helpers live INSIDE that namespace at src/guardkitfactory/lib/, imported as
# `from guardkitfactory.lib.factory_guards import ...`.
#
# They used to ship as a bare top-level `lib` distribution package. That is a
# namespace-hygiene violation (guardkit `.claude/rules/namespace-hygiene.md`,
# instance #3, 2026-08-04): in the forge image this distribution's `lib/`
# landed in site-packages and shadowed guardkit's own `installer/core/lib`,
# so guardkit's fix-task producer (`from lib.review_parser import ...`) died
# with ModuleNotFoundError. Never reintroduce a bare top-level package here.
[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "guardkitfactory",
    "guardkitfactory.harness",
    "guardkitfactory.lib",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The process-launch scan test carries its synthetic probe packages as
# one-line source strings, some hundreds of characters long.
"tests/harness/test_shell_has_no_factory_credentials.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
