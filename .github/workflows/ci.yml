name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      # This package imports GuardKit at run time (the harness subclasses its
      # HarnessAdapter; the shells use its project-command environment) but
      # does not declare it, because GuardKit depends on this package. As
      # GuardKit's own workflow installs this repository beside it, this job
      # installs GuardKit's default branch (a public repository) into the
      # same environment. Without it no test module can be imported.
      - name: Install GuardKit (sibling repository)
        run: |
          git clone --depth 1 https://github.com/guardkit/guardkit.git "$RUNNER_TEMP/guardkit"
          uv pip install -e "$RUNNER_TEMP/guardkit"

      - name: pytest
        run: uv run pytest tests/ -v

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: mypy
        run: uv run mypy src/
